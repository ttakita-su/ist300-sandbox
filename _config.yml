# ist300-sandbox: GitHub Pages build settings.
#
# The sites in this repository are plain HTML and are published exactly as
# they are. twisted-takes/ is different: it is a Jekyll site meant to live in
# its own repository (see twisted-takes/README.md). It is excluded here so
# GitHub Pages does not try to build its templates as part of this site.
exclude:
  - twisted-takes
  # Setting `exclude` replaces Jekyll's default list, so keep these too:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
