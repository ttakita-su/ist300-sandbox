# =============================================================================
# Twisted Takes: site configuration
#
# This is the one file to edit for brand, address, social channels, analytics
# and the community form. After changing it, restart `bundle exec jekyll serve`
# (Jekyll does not reload _config.yml on its own). On GitHub Pages, pushing the
# change triggers a rebuild.
# =============================================================================

# --- Brand -------------------------------------------------------------------
title: "Twisted Takes"
tagline: "Strong opinions. Better watchlists."
description: >-
  Twisted Takes is a student-run movie and TV review community: longer reviews,
  genre guides, watch-next recommendations and discussion prompts that connect
  to our Instagram, TikTok and YouTube channels.
lang: "en-US"
locale: "en_US"
# Default byline for reviews and articles that do not set `author:`.
author: "Twisted Takes"

# --- Address -------------------------------------------------------------------
# url:     the scheme and host only, no trailing slash.
# baseurl: the repository path for a project site, with a leading slash and no
#          trailing slash. Use "" for a user site (USERNAME.github.io repo) or
#          a custom domain.
#
#   Project site https://USERNAME.github.io/twisted-takes/
#     url: "https://USERNAME.github.io"
#     baseurl: "/twisted-takes"
#   User site    https://USERNAME.github.io/
#     url: "https://USERNAME.github.io"
#     baseurl: ""
#
# Every link, image, script, canonical URL and search request is built from
# these two values, so they are the only thing to change when the site moves.
url: "https://ttakita-su.github.io"
baseurl: "/twisted-takes"

# --- Home page -----------------------------------------------------------------
# The featured story at the top of the home page, chosen by hand.
#   collection: posts | watch_next
#   slug:       the post's file name without the date and .md
#               (2026-10-18-five-genres-five-starting-points.md ->
#               five-genres-five-starting-points), or a Watch Next `slug:`.
# If the slug is not found, the home page falls back to the newest post.
featured:
  collection: "posts"
  slug: "five-genres-five-starting-points"

# --- Social channels -------------------------------------------------------------
# Full profile URLs, e.g. "https://www.instagram.com/yourhandle/",
# "https://www.tiktok.com/@yourhandle", "https://www.youtube.com/@yourhandle".
# Leave a value empty ("") and every link to that platform is hidden.
social:
  instagram: ""
  tiktok: ""
  youtube: ""

# --- Analytics (Google Analytics 4) ------------------------------------------------
# Paste the web stream's Measurement ID (it starts with "G-"). While this is
# empty, no analytics code is loaded on any page. The tag only loads in a
# production build (GitHub Pages always builds in production); see README.md,
# "Analytics", to test it locally.
analytics:
  ga4_measurement_id: ""

# --- Community form (optional) -----------------------------------------------------
# A real external form or poll (Google Forms, Microsoft Forms, Tally, ...).
#   url:       the public link people open to respond. Empty = no form button.
#   embed_url: optional; an embeddable version of the same form (for Google
#              Forms, the URL ending in "viewform?embedded=true"). When set,
#              the Community page shows the form inline as well as the link.
#   provider:  the service name, shown to readers and in the privacy notice.
#   label:     the button text.
community_form:
  url: ""
  embed_url: ""
  provider: ""
  label: "Suggest a movie or answer this week's poll"

# --- Privacy notice --------------------------------------------------------------------
# The privacy page and footer note are generated from the integrations above
# (analytics, form, social links). Add a contact address or extra sentence here.
privacy:
  contact: ""        # e.g. an email address or a social profile URL
  extra_note: ""     # optional sentence appended to the privacy page

# =============================================================================
# Build settings: change with care
# =============================================================================
timezone: "America/New_York"
# GitHub Pages applies its default "Primer" theme unless told otherwise; this
# site has its own layouts and stylesheet, so no theme is used.
theme: null
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# Only plugins that GitHub Pages supports.
plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

collections:
  reviews:
    output: true
    permalink: /reviews/:slug/
  watch_next:
    output: true
    permalink: /watch-next/:slug/

defaults:
  - scope:
      path: ""
      type: reviews
    values:
      layout: review
      media_type: "movie"
  - scope:
      path: ""
      type: watch_next
    values:
      layout: article
      kicker: "Watch Next"
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      permalink: /articles/:year/:month/:title/
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Files that are part of the repository but not the website. GitHub Pages
# renders stray Markdown files, so documentation and templates are listed here.
exclude:
  - README.md
  - EDITOR_GUIDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - tools
  - templates
  - .jekyll-cache
