<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/, 'js');</script>
{% include seo.html %}
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} articles" href="{{ '/feed.xml' | relative_url }}">
<script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{%- for script in page.scripts %}
<script src="{{ script | prepend: '/assets/js/' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{%- endfor %}
{% include analytics.html %}
